app = "ye-planner"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  PLANNER_HOME = "/data"
  PLANNER_MCP_RESOURCE_URL = "https://ye-planner.fly.dev/mcp"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "planner_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
